<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ココロの週末銭湯 スタンプラリー</title>

<style>
:root{
  --bg: #f3ede2;
  --main: #cd7658;
  --main-dark: #b96549;
  --text: #6f5f57;
  --sub: #8f7e75;
  --mint: #b9d8cb;
  --card: #fffaf4;
  --line: rgba(0,0,0,0.05);
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  color:var(--text);
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:18px 12px 24px;
}

.wrapper{
  width:100%;
  max-width:390px;
  text-align:center;
}

/* タイトル */
h1{
  margin:0 0 10px;
  font-size:clamp(22px, 6vw, 28px);
  line-height:1.35;
  color:var(--main);
  font-weight:700;
  letter-spacing:0.02em;
  user-select:none;
  cursor:pointer;
}

/* イラスト */
.main-visual{
  width:min(170px, 48vw);
  display:block;
  margin:0 auto 12px;
}

/* 説明 */
.subtitle{
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  margin:0 auto 16px;
}

/* スタンプ一覧 */
.card{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
  max-width:340px;
  margin:0 auto 14px;
}

.slot{
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:10px 8px 8px;
  min-height:106px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:transform 0.12s ease, background 0.2s ease;
  cursor:pointer;
  border:1px solid transparent;
}

.slot:active{
  transform:scale(0.97);
  background:#fff8f1;
}

.slot.stamped{
  border:1px solid #f0e3d8;
}

.stamp-mark{
  font-size:28px;
  line-height:1;
  margin-bottom:8px;
}

.stamp-label{
  font-size:13px;
  line-height:1.35;
  color:var(--sub);
  font-weight:600;
  text-align:center;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 最後の1マスを中央寄せ */
.slot.last-single{
  grid-column:1 / -1;
  width:48%;
  justify-self:center;
}

/* 達成状況 */
.progress{
  font-size:13px;
  color:#9b8a81;
  margin:0 0 10px;
  font-weight:600;
}

/* ごほうびエリア */
.reward-area{
  min-height:84px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.reward-btn,
.reward-done{
  width:min(280px, 88%);
  min-height:72px;
  border-radius:24px;
  font-size:18px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  box-sizing:border-box;
}

.reward-btn{
  border:3px solid var(--main);
  background:#fff6f0;
  color:var(--main);
  cursor:pointer;
  transition:transform 0.12s ease, opacity 0.2s ease;
}

.reward-btn:active{
  transform:scale(0.98);
}

.reward-done{
  border:3px solid var(--mint);
  background:#f3fbf8;
  color:#78a796;
  letter-spacing:0.04em;
}

/* 小さいスマホ向け */
@media (max-width: 360px){
  body{
    padding:14px 10px 20px;
  }

  .main-visual{
    width:min(150px, 46vw);
    margin-bottom:10px;
  }

  .subtitle{
    font-size:14px;
    margin-bottom:14px;
  }

  .card{
    gap:9px;
    max-width:320px;
  }

  .slot{
    min-height:98px;
    border-radius:18px;
    padding:8px 6px;
  }

  .stamp-mark{
    font-size:26px;
    margin-bottom:6px;
  }

  .stamp-label{
    font-size:12px;
    min-height:30px;
  }

  .reward-btn,
  .reward-done{
    min-height:66px;
    font-size:17px;
    border-radius:22px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <h1 id="mainTitle">
    ココロの週末銭湯<br>
    スタンプラリー
  </h1>

  <img src="onsen.png" class="main-visual" alt="週末銭湯のイラスト">

  <div class="subtitle">
    この画面をブーススタッフにご提示ください。<br>
    スタンプ3つで、おみやげプレゼント♩
  </div>

  <div class="progress" id="progressText"></div>

  <div class="card" id="card"></div>

  <div class="reward-area" id="rewardArea"></div>

</div>

<script>
/*
保存内容
- stamps: 各ブースの押印状態（true / false）
- rewardStatus:
    "none"  = 未達成
    "ready" = 3つ達成・交換前
    "done"  = 交換済み
*/

const boothNames = [
  "読書処",
  "娯楽室",
  "足湯雑談",
  "みんなの入浴剤",
  "お茶コーナー"
];

let stamps = JSON.parse(localStorage.getItem("stamps")) || [false, false, false, false, false];
let rewardStatus = localStorage.getItem("rewardStatus") || "none";

let titleTapCount = 0;
let titleTapTimer = null;

function saveData(){
  localStorage.setItem("stamps", JSON.stringify(stamps));
  localStorage.setItem("rewardStatus", rewardStatus);
}

function getStampCount(){
  return stamps.filter(Boolean).length;
}

function render(){
  const card = document.getElementById("card");
  const rewardArea = document.getElementById("rewardArea");
  const progressText = document.getElementById("progressText");

  card.innerHTML = "";
  rewardArea.innerHTML = "";

  const count = getStampCount();
  progressText.textContent = `スタンプ ${count} / 3`;

  boothNames.forEach((name, i) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    if(stamps[i]) slot.classList.add("stamped");
    if(i === boothNames.length - 1) slot.classList.add("last-single");

    slot.onclick = () => toggleStamp(i);

    const mark = document.createElement("div");
    mark.className = "stamp-mark";
    mark.textContent = stamps[i] ? "♨️" : "◯";

    const label = document.createElement("div");
    label.className = "stamp-label";
    label.textContent = name;

    slot.appendChild(mark);
    slot.appendChild(label);
    card.appendChild(slot);
  });

  if(count >= 3 && rewardStatus === "none"){
    rewardStatus = "ready";
    saveData();
  }

  if(rewardStatus === "ready"){
    rewardArea.innerHTML = `
      <button class="reward-btn" onclick="exchangeGift()">
        おみやげ交換へ☺︎
      </button>
    `;
  } else if(rewardStatus === "done"){
    rewardArea.innerHTML = `
      <div class="reward-done">
        THANK YOU!!
      </div>
    `;
  }
}

function toggleStamp(index){
  stamps[index] = !stamps[index];

  const count = getStampCount();

  if(rewardStatus === "done" && count < 3){
    rewardStatus = "none";
  } else if(rewardStatus === "ready" && count < 3){
    rewardStatus = "none";
  } else if(rewardStatus === "none" && count >= 3){
    rewardStatus = "ready";
  }

  saveData();
  render();
}

function exchangeGift(){
  rewardStatus = "done";
  saveData();
  render();
}

/* タイトル5回タップでリセット */
document.getElementById("mainTitle").addEventListener("click", function(){
  titleTapCount++;

  clearTimeout(titleTapTimer);
  titleTapTimer = setTimeout(() => {
    titleTapCount = 0;
  }, 2000);

  if(titleTapCount >= 5){
    if(confirm("スタンプをリセットしますか？")){
      stamps = [false, false, false, false, false];
      rewardStatus = "none";
      saveData();
      render();
    }
    titleTapCount = 0;
  }
});

render();
</script>

</body>
</html>
