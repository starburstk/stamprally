<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ココロの週末銭湯 スタンプラリー</title>

<style>
body{
  font-family:"Hiragino Maru Gothic ProN",sans-serif;
  text-align:center;
  background:#f6f1e7;
  margin:0;
  padding:30px 10px 50px;
  color:#6b5b53;
}

h1{
  font-size: 26px;
  color:#c96f53;
  line-height: 1.4;
  margin-bottom:10px;
}

.main-visual{
  width:220px;
  max-width:70%;
  margin:10px auto 24px;
  display:block;
  border:none;
}

.subtitle{
  font-size:18px;
  color:#6b5b53;
  margin-bottom: 28px;
}

.card{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  max-width:320px;
  margin:20px auto 36px;
}

.slot{
  aspect-ratio: 1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  border-radius:24px;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
  transition:transform 0.12s ease, background 0.2s ease;
}

.slot.empty{
  cursor:pointer;
  background:#fffaf3;
}

.slot.empty:active{
  transform:scale(0.94);
  background:#fdf3ea;
}

.stamp-mark{
  font-size:32px;
}

.stamp-date{
  font-size:14px;
  margin-top:8px;
  color:#a1887f;
  font-weight:600;
}

/* ごほうびエリア */
.reward-area{
  min-height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.reward-btn,
.reward-done{
  width:280px;
  max-width:85%;
  min-height:92px;
  border-radius:28px;
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  box-sizing:border-box;
}

/* おみやげ交換へボタン */
.reward-btn{
  border:3px solid #d97a5b;
  background:#fff7f2;
  color:#c96f53;
  cursor:pointer;
  transition:transform 0.12s ease, opacity 0.2s ease;
}

.reward-btn:active{
  transform:scale(0.97);
}

/* THANK YOU表示 */
.reward-done{
  border:3px solid #b8d8cc;
  background:#f3fbf8;
  color:#7aa998;
  letter-spacing:0.04em;
}
</style>
</head>

<body>

<h1>
ココロの週末銭湯<br>
スタンプラリー
</h1>

<img src="onsen.png" class="main-visual" alt="週末銭湯のイラスト">

<div class="subtitle">
ブースへ行ったら◯ボタンを押してね
</div>

<div class="card" id="card"></div>

<div class="reward-area" id="rewardArea"></div>

<script>
/*
保存される内容
- stamps: スタンプ数
- rewardStatus:
   "none"     = まだ未達成
   "ready"    = 3個たまって交換前
   "done"     = 交換済み（THANK YOU!!）
*/

let stamps = JSON.parse(localStorage.getItem("stamps")) || [];
let rewardStatus = localStorage.getItem("rewardStatus") || "none";

function saveData(){
  localStorage.setItem("stamps", JSON.stringify(stamps));
  localStorage.setItem("rewardStatus", rewardStatus);
}

function render(){
  const card = document.getElementById("card");
  const rewardArea = document.getElementById("rewardArea");
  card.innerHTML = "";
  rewardArea.innerHTML = "";

  // スタンプ3つ表示
  for(let i=0; i<3; i++){
    let slot = document.createElement("div");
    slot.className = "slot";

    let mark = document.createElement("div");
    mark.className = "stamp-mark";

    let number = document.createElement("div");
    number.className = "stamp-date";

    if(stamps[i]){
      mark.textContent = "♨️";
      number.textContent = i + 1;
    }else{
      mark.textContent = "◯";
      number.textContent = "";
      slot.classList.add("empty");
      slot.onclick = addStamp;
    }

    slot.appendChild(mark);
    slot.appendChild(number);
    card.appendChild(slot);
  }

  // 3つたまったら rewardStatus を ready に
  if(stamps.length >= 3 && rewardStatus === "none"){
    rewardStatus = "ready";
    saveData();
  }

  // ごほうび表示
  if(rewardStatus === "ready"){
    rewardArea.innerHTML = `
      <button class="reward-btn" onclick="exchangeGift()">
        おみやげ交換へ☺︎
      </button>
    `;
  } else if(rewardStatus === "done"){
    rewardArea.innerHTML = `
      <div class="reward-done">
        THANK YOU!!
      </div>
    `;
  }
}

function addStamp(){
  if(stamps.length >= 3){
    return;
  }

  stamps.push(true);
  saveData();
  render();
}

function exchangeGift(){
  rewardStatus = "done";
  saveData();
  render();
}

render();
</script>

</body>
</html>
