<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ココロの週末銭湯 スタンプラリー</title>

<style>
body{
  font-family:"Hiragino Maru Gothic ProN",sans-serif;
  text-align:center;
  background:#f6f1e7;
  margin:0;
  padding:30px 12px 50px;
  color:#6b5b53;
}

h1{
  font-size: 26px;
  color:#c96f53;
  line-height: 1.4;
  margin-bottom:10px;
  cursor:pointer;
  user-select:none;
}

.main-visual{
  width:220px;
  max-width:70%;
  margin:10px auto 24px;
  display:block;
  border:none;
}

.subtitle{
  font-size:17px;
  color:#6b5b53;
  margin-bottom: 28px;
  line-height:1.8;
}

.card{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:360px;
  margin:20px auto 36px;
}

.slot{
  aspect-ratio: 1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  border-radius:24px;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
  transition:transform 0.12s ease, background 0.2s ease;
  padding:10px;
  box-sizing:border-box;
  cursor:pointer;
}

.slot:active{
  transform:scale(0.95);
  background:#fdf7f1;
}

.stamp-mark{
  font-size:32px;
  margin-bottom:10px;
}

.stamp-label{
  font-size:14px;
  color:#8c776d;
  font-weight:600;
  line-height:1.5;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.reward-area{
  min-height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.reward-btn,
.reward-done{
  width:290px;
  max-width:88%;
  min-height:92px;
  border-radius:28px;
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  box-sizing:border-box;
}

.reward-btn{
  border:3px solid #d97a5b;
  background:#fff7f2;
  color:#c96f53;
  cursor:pointer;
  transition:transform 0.12s ease, opacity 0.2s ease;
}

.reward-btn:active{
  transform:scale(0.97);
}

.reward-done{
  border:3px solid #b8d8cc;
  background:#f3fbf8;
  color:#7aa998;
  letter-spacing:0.04em;
}

.helper{
  font-size:12px;
  color:#b09b91;
  margin-top:8px;
}
</style>
</head>

<body>

<h1 id="mainTitle">
ココロの週末銭湯<br>
スタンプラリー
</h1>

<img src="onsen.png" class="main-visual" alt="週末銭湯のイラスト">

<div class="subtitle">
この画面をブーススタッフにご提示ください。<br>
スタンプ3つで、おみやげプレゼント♩
</div>

<div class="card" id="card"></div>

<div class="reward-area" id="rewardArea"></div>

<div class="helper"></div>

<script>
/*
保存内容
- stamps: 各ブースの押印状態（true/false）
- rewardStatus:
   "none"  = 未達成
   "ready" = 3つ達成・交換前
   "done"  = 交換済み
*/

const boothNames = [
  "読書処",
  "娯楽室",
  "足湯雑談",
  "みんなの入浴剤",
  "お茶コーナー"
];

let stamps = JSON.parse(localStorage.getItem("stamps")) || [false, false, false, false, false];
let rewardStatus = localStorage.getItem("rewardStatus") || "none";
let titleTapCount = 0;
let titleTapTimer = null;

function saveData(){
  localStorage.setItem("stamps", JSON.stringify(stamps));
  localStorage.setItem("rewardStatus", rewardStatus);
}

function getStampCount(){
  return stamps.filter(Boolean).length;
}

function render(){
  const card = document.getElementById("card");
  const rewardArea = document.getElementById("rewardArea");
  card.innerHTML = "";
  rewardArea.innerHTML = "";

  boothNames.forEach((name, i) => {
    let slot = document.createElement("div");
    slot.className = "slot";
    slot.onclick = () => toggleStamp(i);

    let mark = document.createElement("div");
    mark.className = "stamp-mark";
    mark.textContent = stamps[i] ? "♨️" : "◯";

    let label = document.createElement("div");
    label.className = "stamp-label";
    label.textContent = name;

    slot.appendChild(mark);
    slot.appendChild(label);
    card.appendChild(slot);
  });

  const count = getStampCount();

  if(count >= 3 && rewardStatus === "none"){
    rewardStatus = "ready";
    saveData();
  }

  if(rewardStatus === "ready"){
    rewardArea.innerHTML = `
      <button class="reward-btn" onclick="exchangeGift()">
        おみやげ交換へ☺︎
      </button>
    `;
  } else if(rewardStatus === "done"){
    rewardArea.innerHTML = `
      <div class="reward-done">
        THANK YOU!!
      </div>
    `;
  }
}

function toggleStamp(index){
  // 交換済み後は変更不可にしたい場合はここを有効化
  // if(rewardStatus === "done") return;

  stamps[index] = !stamps[index];

  const count = getStampCount();

  if(rewardStatus === "done" && count < 3){
    rewardStatus = "none";
  } else if(rewardStatus === "ready" && count < 3){
    rewardStatus = "none";
  } else if(rewardStatus === "none" && count >= 3){
    rewardStatus = "ready";
  }

  saveData();
  render();
}

function exchangeGift(){
  rewardStatus = "done";
  saveData();
  render();
}

// タイトル5回タップでリセット
document.getElementById("mainTitle").addEventListener("click", function(){
  titleTapCount++;

  clearTimeout(titleTapTimer);
  titleTapTimer = setTimeout(() => {
    titleTapCount = 0;
  }, 2000); // 2秒以内に連続タップ

  if(titleTapCount >= 5){
    if(confirm("スタンプをリセットしますか？")){
      stamps = [false, false, false, false, false];
      rewardStatus = "none";
      saveData();
      render();
    }
    titleTapCount = 0;
  }
});

render();
</script>

</body>
</html>
