<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ココロの週末銭湯 スタンプラリー</title>

<style>

body{
font-family:"Hiragino Maru Gothic ProN",sans-serif;
text-align:center;
background:#f6f1e7;
margin:0;
padding:30px 10px;
}

/* タイトル */
h1{
font-size: 26px;
color:#c96f53;
line-height: 1.4;
margin-bottom:10px;
}

/* イラスト */
.main-visual{
width:200px;
margin:10px auto 20px;
display:block;
}

/* サブテキスト */
.subtitle{
font-size:18px;
color:#6b5b53;
margin-bottom: 25px;
}

/* カード */
.card{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
max-width:320px;
margin:20px auto;
}

/* スタンプ枠 */
.slot{
aspect-ratio: 1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#ffffff;
border-radius:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* 押せる状態 */
.slot.empty{
cursor:pointer;
background:#fffaf3;
}

.slot.empty:active{
transform:scale(0.9);
}

/* スタンプ */
.stamp-mark{
font-size:32px;
}

/* 数字 */
.stamp-date{
font-size:14px;
margin-top:5px;
color:#a1887f;
}

/* おみやげ */
.reward{
margin-top:30px;
padding:20px;
font-size:20px;
border-radius:16px;
border:3px solid #d97a5b;
background:#fff7f2;
color:#c96f53;
display:none;
width:260px;
margin-left:auto;
margin-right:auto;
}

</style>
</head>

<body>

<h1>
ココロの週末銭湯<br>
スタンプラリー
</h1>

<!-- ★ここに画像（同じフォルダに置く） -->
<img src="onsen.png" class="main-visual">

<div class="subtitle">
ブースへ行ったら◯ボタンを押してね
</div>

<div class="card" id="card"></div>

<div id="reward" class="reward">
おみやげGET！
</div>

<script>

let stamps = JSON.parse(localStorage.getItem("stamps")) || []

function render(){
  const card=document.getElementById("card")
  card.innerHTML=""

  for(let i=0;i<3;i++){
    let slot=document.createElement("div")
    slot.className="slot"

    let mark=document.createElement("div")
    mark.className="stamp-mark"

    let number=document.createElement("div")
    number.className="stamp-date"

    if(stamps[i]){
      mark.textContent="♨️"
      number.textContent = i + 1
    }else{
      mark.textContent="◯"
      number.textContent=""
      slot.classList.add("empty")
      slot.onclick = addStamp
    }

    slot.appendChild(mark)
    slot.appendChild(number)
    card.appendChild(slot)
  }

  // ★3つたまったら表示
  if(stamps.length >= 3){
    document.getElementById("reward").style.display = "block"
  }
}

function addStamp(){
  if(stamps.length>=3){
    return
  }

  stamps.push(true)
  localStorage.setItem("stamps",JSON.stringify(stamps))
  render()
}

render()

</script>

</body>
</html>
